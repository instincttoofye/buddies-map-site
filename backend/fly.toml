# fly.toml app configuration file generated for buddies-map-backend on 2026-08-30T12:41:17-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'buddies-map-backend'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
